apiVersion: v1
kind: ConfigMap
metadata:
  name: web-content
data:
  index.html: |
    <html>
      <body style="font-family: sans-serif; text-align:center; margin-top: 100px;">
        <h1>🚀 GitOps Demo</h1>
        <h2>Versión: 1</h2>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-demo
  labels:
    app: gitops-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitops-demo
  template:
    metadata:
      labels:
        app: gitops-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: web-content
              mountPath: /usr/share/nginx/html
      volumes:
        - name: web-content
          configMap:
            name: web-content
---
apiVersion: v1
kind: Service
metadata:
  name: gitops-demo-svc
spec:
  type: NodePort
  selector:
    app: gitops-demo
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080